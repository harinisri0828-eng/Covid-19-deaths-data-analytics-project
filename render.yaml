services:
  # ----------------------------------------------------
  # Backend Web Service (FastAPI + Uvicorn)
  # ----------------------------------------------------
  - type: web
    name: covid-analytics-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/ingest_owid.py && python scripts/ingest_india.py && python scripts/train_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: covid-analytics-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://covid-analytics-frontend.onrender.com,http://localhost:5173,http://127.0.0.1:5173
      - key: DATA_SOURCE_URL
        value: https://covid.ourworldindata.org/data/owid-covid-data.csv

  # ----------------------------------------------------
  # Frontend Static Site (React + Vite + Tailwind CSS v4)
  # ----------------------------------------------------
  - type: web
    name: covid-analytics-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://covid-analytics-backend.onrender.com

# ----------------------------------------------------
# PostgreSQL Managed Database
# ----------------------------------------------------
databases:
  - name: covid-analytics-db
    databaseName: covid_db
    user: covid_user
    plan: free
